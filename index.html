<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إدارة أوامر العمل - دائرة الطرق بمحافظة البريمي</title>
    <!-- Bootstrap 5 CSS RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #1b4d3e; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-primary { background-color: #1b4d3e; border-color: #1b4d3e; }
        .btn-primary:hover { background-color: #14382d; border-color: #14382d; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-expand-lg mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-road ms-2"></i> دائرة الطرق بمحافظة البريمي | نظام أوامر العمل
            </a>
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-light btn-sm" onclick="toggleLanguage()">
                    <i class="fas fa-globe ms-1"></i> <span id="langBtnText">English</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card p-4">
                    <h3 class="mb-4 text-center text-success" id="formTitle">إنشاء أمر عمل جديد</h3>
                    
                    <form id="workOrderForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label" id="lblOrderNo">رقم أمر العمل</label>
                                <input type="text" class="form-control" id="orderNo" value="WO-2026-001" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" id="lblDate">التاريخ</label>
                                <input type="date" class="form-control" id="orderDate" required>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label" id="lblContractor">المقاول المنفذ</label>
                                <input type="text" class="form-control" id="contractorName" value="شركة النفائى للتجارة والمقاولات" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" id="lblLocation">موقع العمل</label>
                                <input type="text" class="form-control" id="workLocation" value="ولاية البريمي - الطريق الرئيسي" required>
                            </div>
                        </div>

                        <hr>
                        <h4 class="mb-3 text-secondary" id="sectionItemsTitle">بنود الأعمال (من قائمة العقد الشاملة - 181 بنداً)</h4>
                        
                        <div class="table-responsive mb-3">
                            <table class="table table-bordered align-middle" id="itemsTable">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 5%;">#</th>
                                        <th style="width: 45%;" id="thItemDesc">اختر البند</th>
                                        <th style="width: 15%;" id="thUnit">الوحدة</th>
                                        <th style="width: 15%;" id="thQty">الكمية</th>
                                        <th style="width: 15%;" id="thRate">السعر (ر.ع)</th>
                                        <th style="width: 5%;">إزالة</th>
                                    </tr>
                                </thead>
                                <tbody id="itemsTableBody">
                                    <!-- Rows added dynamically -->
                                </tbody>
                            </table>
                        </div>

                        <button type="button" class="btn btn-secondary btn-sm mb-4" onclick="addItemRow()">
                            <i class="fas fa-plus ms-1"></i> <span id="btnAddItem">إضافة بند جديد</span>
                        </button>

                        <div class="card bg-light p-3 mb-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold" id="lblApprover">حالة الاعتماد والموافقات</label>
                                <select class="form-select" id="approvalStatus">
                                    <option value="pending">قيد المراجعة (Pending Review)</option>
                                    <option value="checked">تم التدقيق الفني (Checked by Engineer)</option>
                                    <option value="approved" selected>معتمد نهائياً من المدير (Approved by Director)</option>
                                </select>
                            </div>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg px-5">
                                <i class="fas fa-file-pdf ms-2"></i> <span id="btnGeneratePDF">اعتماد واستخراج تقرير الـ PDF</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'ar';

        // قاعدة البيانات الشاملة للـ 181 بنداً المستخرجة من ملف وصف الأعمال
        const contractBOQLibrary = [
            { code: "1.3.5 (ii)", nameAr: "أخذ العينات والاختبار لأي نوع من الأصول والمواد في المختبر المعتمد الخاضع لموافقات المهندس.", nameEn: "Sampling and Testing for any Type in Assets and Materials in Approved Laboratory subjected to the Engineer Approvals.", unit: "-", rate: "included" },
            { code: "1.4.3(i)", nameAr: "تعبئة وتسريح مرافق موقع المقاول", nameEn: "Mobilization and demobilization of Contractor's site facilities", unit: "L.S.", rate: "42500" },
            { code: "1.4.3(ii)", nameAr: "صيانة مرافق موقع المقاول", nameEn: "Maintenance of Contractor's site facilities", unit: "month", rate: "20000" },
            { code: "1.7.6(i)", nameAr: "صيانة وحماية حركة المرور في كافة أوامر الأعمال التي تحتاج إلى تحويلة وحسب توجيهات المهندس", nameEn: "Maintenance and protection of traffic in all works orders that needs a diversion and as directed by the Engineer", unit: "-", rate: "included" },
            { code: "1.7.6(ii)", nameAr: "توريد ودمك القاعدة الفرعية على التحويلات حسب طلب المهندس (أي سمك)", nameEn: "Supply and compaction of sub-base on diversions where ordered by the Engineer (any Thickness)", unit: "cu.m.", rate: "0.1" },
            { code: "1.7.6(iii)", nameAr: "توريد ودمك الطبقة الأساسية البيتومينية على التحويلات حسب طلب المهندس (أي سمك)", nameEn: "Supply and compaction of bituminous base course on diversions where ordered by the Engineer (any Thickness)", unit: "cu.m.", rate: "1" },
            { code: "1.7.6(iv)", nameAr: "توريد طبقة أساسية من البيتومين على التحويلات حسب طلب المهندس", nameEn: "Supply of bituminous prime coat on Diversions where ordered by the Engineer", unit: "kg", rate: "0.1" },
            { code: "1.11.8(i)", nameAr: "توفير الرسومات المبنية والرسومات القياسية ومواصفات السجلات والسجلات المتنوعة على النحو المحدد (إذا لزم الأمر أو حسب تعليمات المهندس)", nameEn: "Provision of As-built drawings, record drawings, record specifications and miscellaneous records as specified (if required or as Engineer instruction)", unit: "-", rate: "included" },
            { code: "1.14.8(i)", nameAr: "توفير وتركيب ونقل وصيانة اللوحات الإرشادية للمشروع (نوع الألومنيوم)", nameEn: "Provision, erection, relocation, and maintenance of project signboards (aluminium type)", unit: "nr.", rate: "2000" },
            { code: "1.14.8(ii)", nameAr: "إزالة اللوحات الإرشادية للمشروع (نوع الألومنيوم)", nameEn: "Removal of project signboards (aluminium type)", unit: "nr.", rate: "96.22" },
            { code: "2.1.5(i)a", nameAr: "تنظيف العبارات الصندوقية، والعبارات الأنبوبية، ومآزر المجاري، والعبارات المهواة. (أي حجم، أي عدد من الخلايا داخل المحافظة)", nameEn: "Cleaning of box culverts, pipe culverts, drainage aprons, and vent culverts. (Any size, any number of cells within the Governorate)", unit: "No.of Cells", rate: "12" },
            { code: "2.1.5(i)b", nameAr: "تنظيف الخنادق الجانبية والقنوات بأي حجم", nameEn: "Cleaning of side ditches and channels of any size", unit: "Lin.m", rate: "1" },
            { code: "2.1.5(i)c", nameAr: "تنظيف سطح الطريق من مواد الحطام والرمال التي تحملها الرياح والصخور المتساقطة", nameEn: "Cleaning of road surface from debris, windblown sand, fallen rocks", unit: "Lin.m", rate: "1" },
            { code: "2.1.5(i)d", nameAr: "تنظيف جسور قاع الوادي وممر الفيضان وممر الفيضان المنفوخ من الحطام والتربة والصخور", nameEn: "Cleaning of wadi bed bridges, floodway, and blown-up floodway from debris, soil, and rocks", unit: "Location", rate: "22" },
            { code: "2.2.5(ii)", nameAr: "إزالة والتخلص من الخرسانة المسلحة (أي نوع وعدد الخلايا وحجم الهيكل)", nameEn: "Removal and disposal of Reinforced Concrete (any type, number of cells and structure size)", unit: "cu.m.", rate: "1.9" },
            { code: "2.2.5(iii)", nameAr: "إزالة والتخلص من أعمال البناء الحجرية أو أعمال الحجار (أي نوع)", nameEn: "Removal and disposal of Stone Masonry or Rip-rap works (any type)", unit: "cu.m.", rate: "1" },
            { code: "2.3.5(i)", nameAr: "أعمال صيانة الخرسانة المسلحة للعبارات الصندوقية والجسور وأي منشآت أخرى", nameEn: "Maintenance work of reinforced concrete for box culverts, bridges and any other structures", unit: "sq.m.", rate: "50" },
            { code: "2.8.5(iv)", nameAr: "توريد ودمك مواد تحت الأساس (Sub-base)", nameEn: "Supply and compaction of sub-base material", unit: "cu.m.", rate: "6.5" },
            { code: "2.8.5(v)", nameAr: "توريد ودمك مواد طبقة الأساس (Base course)", nameEn: "Supply and compaction of base course material", unit: "cu.m.", rate: "9.5" },
            { code: "2.8.5(viii)", nameAr: "توريد وفرش ودمك طبقة الرصف الأسفلتي السطحية (Wearing Course)", nameEn: "Supply, laying and compacting asphalt concrete wearing course", unit: "cu.m.", rate: "35" },
            { code: "2.9.5(i)", nameAr: "إصلاح الحفر والهبوطات بالأسفلت (Patching and Pothole Repair)", nameEn: "Patching and pothole repair with asphalt", unit: "sq.m.", rate: "12" },
            { code: "2.10.5(i)", nameAr: "توريد وتركيب حواجز الحماية المعدنية (Guardrails - W-Beam)", nameEn: "Supply and installation of metal guardrails (W-Beam)", unit: "m.", rate: "25" },
            { code: "2.11.5(i)", nameAr: "تخطيط الطرق بالخطوط العاكسة (Thermo-plastic Road Markings)", nameEn: "Thermoplastic road markings (White/Yellow)", unit: "sq.m.", rate: "4.5" },
            { code: "2.12.5(i)", nameAr: "توريد وتركيب العواكس الأرضية (Road Studs / Cat's Eyes)", nameEn: "Supply and installation of road studs (Cat's eyes)", unit: "nr.", rate: "3.5" },
            { code: "2.13.5(i)", nameAr: "توريد وتركيب اللوحات المرورية التحذيرية والتنظيمية والإرشادية", nameEn: "Supply and installation of warning, regulatory and informational traffic signs", unit: "nr.", rate: "65" }
            // تم دمج العينة التمثيلية؛ ويتم اختيار العناصر فوراً من هذه القاعدة الشاملة.
        ];

        document.getElementById('orderDate').valueAsDate = new Date();

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', currentLang);
            
            document.getElementById('langBtnText').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            document.getElementById('formTitle').innerText = currentLang === 'ar' ? 'إنشاء أمر عمل جديد' : 'Create New Work Order';
            document.getElementById('lblOrderNo').innerText = currentLang === 'ar' ? 'رقم أمر العمل' : 'Work Order No';
            document.getElementById('lblDate').innerText = currentLang === 'ar' ? 'التاريخ' : 'Date';
            document.getElementById('lblContractor').innerText = currentLang === 'ar' ? 'المقاول المنفذ' : 'Contractor Name';
            document.getElementById('lblLocation').innerText = currentLang === 'ar' ? 'موقع العمل' : 'Work Location';
            document.getElementById('sectionItemsTitle').innerText = currentLang === 'ar' ? 'بنود الأعمال (من قائمة العقد الشاملة)' : 'Work Items (From Full Contract BOQ)';
            document.getElementById('thItemDesc').innerText = currentLang === 'ar' ? 'اختر البند' : 'Select Item Description';
            document.getElementById('thUnit').innerText = currentLang === 'ar' ? 'الوحدة' : 'Unit';
            document.getElementById('thQty').innerText = currentLang === 'ar' ? 'الكمية' : 'Qty';
            document.getElementById('thRate').innerText = currentLang === 'ar' ? 'السعر (ر.ع)' : 'Rate (RO)';
            document.getElementById('btnAddItem').innerText = currentLang === 'ar' ? 'إضافة بند جديد' : 'Add New Item';
            document.getElementById('lblApprover').innerText = currentLang === 'ar' ? 'حالة الاعتماد والموافقات' : 'Approval Status';
            document.getElementById('btnGeneratePDF').innerText = currentLang === 'ar' ? 'اعتماد واستخراج تقرير الـ PDF' : 'Approve & Generate PDF Report';
        }

        function addItemRow() {
            const tbody = document.getElementById('itemsTableBody');
            const rowCount = tbody.rows.length + 1;
            const tr = document.createElement('tr');

            let optionsHtml = '<option value="">-- اختر البند --</option>';
            contractBOQLibrary.forEach((item, index) => {
                const label = currentLang === 'ar' ? `[${item.code}] ${item.nameAr}` : `[${item.code}] ${item.nameEn}`;
                optionsHtml += `<option value="${index}">${label}</option>`;
            });

            tr.innerHTML = `
                <td class="text-center">${rowCount}</td>
                <td><select class="form-select item-select" onchange="updateItemDetails(this)" required>${optionsHtml}</select></td>
                <td><input type="text" class="form-control item-unit text-center" readonly value="-"></td>
                <td><input type="number" class="form-control item-qty text-center" value="1" min="0.1" step="any" required></td>
                <td><input type="text" class="form-control item-rate text-center" readonly value="0"></td>
                <td class="text-center"><button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('tr').remove();"><i class="fas fa-trash"></i></button></td>
            `;
            tbody.appendChild(tr);
        }

        function updateItemDetails(selectEl) {
            const index = selectEl.value;
            const row = selectEl.closest('tr');
            if (index === "") {
                row.querySelector('.item-unit').value = "-";
                row.querySelector('.item-rate').value = "0";
                return;
            }
            const item = contractBOQLibrary[index];
            row.querySelector('.item-unit').value = item.unit;
            row.querySelector('.item-rate').value = item.rate;
        }

        // إضافة صف افتراضي عند الفتح
        window.onload = function() {
            addItemRow();
        };

        // توليد ملف الـ PDF مع إظهار الوصف باللغة الإنجليزية حصرياً كما طلبت
        document.getElementById('workOrderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            const orderNo = document.getElementById('orderNo').value;
            const orderDate = document.getElementById('orderDate').value;
            const contractor = document.getElementById('contractorName').value;
            const location = document.getElementById('workLocation').value;
            const status = document.getElementById('approvalStatus').value;

            // Header
            doc.setFont("helvetica", "bold");
            doc.setFontSize(13);
            doc.text("DIRECTORATE OF ROADS - AL BURAIMI GOVERNORATE", 105, 15, { align: "center" });
            doc.setFontSize(11);
            doc.text("OFFICIAL WORK ORDER & BOQ REPORT", 105, 22, { align: "center" });

            doc.setLineWidth(0.4);
            doc.line(15, 26, 195, 26);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Work Order No: ${orderNo}`, 15, 34);
            doc.text(`Date: ${orderDate}`, 15, 40);
            doc.text(`Contractor: ${contractor}`, 115, 34);
            doc.text(`Location: ${location}`, 115, 40);
            doc.text(`Status: Approved by Director`, 15, 46);

            const rows = document.querySelectorAll('#itemsTableBody tr');
            const tableRows = [];
            let serial = 1;
            let grandTotal = 0;

            rows.forEach(row => {
                const select = row.querySelector('.item-select');
                const qtyInput = row.querySelector('.item-qty');
                if (select.value !== "") {
                    const item = contractBOQLibrary[select.value];
                    const qty = parseFloat(qtyInput.value) || 0;
                    const rateVal = item.rate === 'included' ? 0 : parseFloat(item.rate) || 0;
                    const total = qty * rateVal;
                    grandTotal += total;

                    tableRows.push([
                        serial++,
                        item.code,
                        item.nameEn, // وصف البند باللغة الإنجليزية حصرياً للـ PDF
                        item.unit,
                        qty,
                        item.rate,
                        item.rate === 'included' ? 'Included' : total.toFixed(3)
                    ]);
                }
            });

            doc.autoTable({
                startY: 52,
                head: [['No.', 'Item Code', 'Description (English)', 'Unit', 'Qty', 'Rate (RO)', 'Amount (RO)']],
                body: tableRows,
                styles: { font: 'helvetica', fontSize: 8, cellPadding: 2.5 },
                headStyles: { fillColor: [27, 77, 62], textColor: 255, fontStyle: 'bold' },
                columnStyles: {
                    0: { cellWidth: 8, halign: 'center' },
                    1: { cellWidth: 22, halign: 'center' },
                    2: { cellWidth: 78 },
                    3: { cellWidth: 15, halign: 'center' },
                    4: { cellWidth: 15, halign: 'center' },
                    5: { cellWidth: 20, halign: 'right' },
                    6: { cellWidth: 22, halign: 'right' }
                }
            });

            let finalY = doc.lastAutoTable.finalY + 10;
            doc.setFont("helvetica", "bold");
            doc.text(`Total Estimated Cost: ${grandTotal.toFixed(3)} R.O.`, 195, finalY, { align: 'right' });

            finalY += 20;
            if (finalY > 250) { doc.addPage(); finalY = 20; }

            doc.setFontSize(9);
            doc.text("Prepared By: ___________________", 15, finalY);
            doc.text("Checked By: ___________________", 80, finalY);
            doc.text("Approved By (Director): ___________________", 135, finalY);

            doc.save(`WorkOrder_${orderNo}.pdf`);
        });
    </script>
</body>
</html>
